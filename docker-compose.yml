version: "3.9"

services:
  postgres:
    image: postgres:14.11
    container_name: online-auction-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: online-auction-auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: ${AUTH_SERVICE_PORT}
      SPRING_APPLICATION_NAME: auth-service

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: auth

      SPRING_FLYWAY_ENABLED: true
      SPRING_FLYWAY_DEFAULT_SCHEMA: auth
      SPRING_FLYWAY_SCHEMAS: auth
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS}

      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never

      LOGGING_LEVEL_ROOT: INFO
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${AUTH_SERVICE_PORT}/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  auction-service:
    build:
      context: ./backend
      dockerfile: auction-service/Dockerfile
    container_name: online-auction-auction-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: ${AUCTION_SERVICE_PORT}
      SPRING_APPLICATION_NAME: auction-service

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: auction

      SPRING_FLYWAY_ENABLED: true
      SPRING_FLYWAY_DEFAULT_SCHEMA: auction
      SPRING_FLYWAY_SCHEMAS: auction
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration

      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never

      LOGGING_LEVEL_ROOT: INFO
    ports:
      - "${AUCTION_SERVICE_PORT}:${AUCTION_SERVICE_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${AUCTION_SERVICE_PORT}/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  bidding-service:
    build:
      context: ./backend
      dockerfile: bidding-service/Dockerfile
    container_name: online-auction-bidding-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: ${BIDDING_SERVICE_PORT}
      SPRING_APPLICATION_NAME: bidding-service

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: bidding

      SPRING_FLYWAY_ENABLED: true
      SPRING_FLYWAY_DEFAULT_SCHEMA: bidding
      SPRING_FLYWAY_SCHEMAS: bidding
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration

      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never

      LOGGING_LEVEL_ROOT: INFO
    ports:
      - "${BIDDING_SERVICE_PORT}:${BIDDING_SERVICE_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${BIDDING_SERVICE_PORT}/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data: