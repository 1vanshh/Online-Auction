name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  JWT_SECRET: ci-test-secret-ci-test-secret-ci-test-secret-123456
  JWT_EXPIRATION_MS: 3600000
  JWT_REFRESH_EXPIRATION_MS: 2592000000

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/service
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests if present
        run: npm run test --if-present

      - name: Build frontend
        run: npm run build

      - name: Upload frontend artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/service/dist
          if-no-files-found: error
          retention-days: 14

  auth_service:
    name: Auth service tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/auth-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Test and package auth-service
        run: ./mvnw --batch-mode --no-transfer-progress clean package

      - name: Upload auth-service test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-surefire-reports
          path: backend/auth-service/target/surefire-reports
          if-no-files-found: warn
          retention-days: 14

      - name: Upload auth-service jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-jar
          path: |
            backend/auth-service/target/*.jar
            !backend/auth-service/target/*.jar.original
          if-no-files-found: error
          retention-days: 14

  auction_service:
    name: Auction service tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/auction-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Test and package auction-service
        run: ./mvnw --batch-mode --no-transfer-progress clean package

      - name: Upload auction-service test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auction-service-surefire-reports
          path: backend/auction-service/target/surefire-reports
          if-no-files-found: warn
          retention-days: 14

      - name: Upload auction-service jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: auction-service-jar
          path: |
            backend/auction-service/target/*.jar
            !backend/auction-service/target/*.jar.original
          if-no-files-found: error
          retention-days: 14

  bidding_service:
    name: Bidding service tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/bidding-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Test and package bidding-service
        run: ./mvnw --batch-mode --no-transfer-progress clean package

      - name: Upload bidding-service test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bidding-service-surefire-reports
          path: backend/bidding-service/target/surefire-reports
          if-no-files-found: warn
          retention-days: 14

      - name: Upload bidding-service jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bidding-service-jar
          path: |
            backend/bidding-service/target/*.jar
            !backend/bidding-service/target/*.jar.original
          if-no-files-found: error
          retention-days: 14

  ci_status:
    name: CI status
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - frontend
      - auth_service
      - auction_service
      - bidding_service
    steps:
      - name: Check required job results
        run: |
          echo "frontend=${{ needs.frontend.result }}"
          echo "auth_service=${{ needs.auth_service.result }}"
          echo "auction_service=${{ needs.auction_service.result }}"
          echo "bidding_service=${{ needs.bidding_service.result }}"

          if [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.auth_service.result }}" != "success" ] || \
             [ "${{ needs.auction_service.result }}" != "success" ] || \
             [ "${{ needs.bidding_service.result }}" != "success" ]; then
            echo "At least one job failed."
            exit 1
          fi

          echo "All checks passed."